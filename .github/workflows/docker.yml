name: Docker Container CI

on:
  push:
    branches: [ main, develop, backend, "backend*", "feature/*" ]
  pull_request:
    branches: [ main, develop, backend, "backend*" ]

jobs:
  validate-compose:
    name: Validate Docker Compose Configurations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Production Compose Config
        run: docker compose -f docker-compose.yml config

      - name: Validate Development Compose Config
        run: docker compose -f docker-compose.dev.yml config

  build-backend:
    name: Build & Verify Backend Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          load: true
          tags: traffic-simulation-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke Test Backend Container
        run: |
          docker run -d --name test-backend -p 8000:8000 traffic-simulation-backend:test
          # Wait up to 30s for the container to start and respond to healthcheck
          for i in {1..15}; do
            if curl -s -f http://localhost:8000/health; then
              echo "Backend health check passed!"
              docker stop test-backend
              exit 0
            fi
            echo "Waiting for backend service to respond... ($i/15)"
            sleep 2
          done
          echo "Backend service failed to respond in time."
          docker logs test-backend
          exit 1

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          load: true
          tags: traffic-simulation-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  stack-integration-smoke-test:
    name: Full-Stack Docker Compose Smoke Test
    needs: [validate-compose, build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start Multi-Container Stack
        run: docker compose up -d --build

      - name: Verify Full Stack Health & Services
        run: |
          echo "Waiting for containerized services to become healthy..."
          for i in {1..20}; do
            BACKEND_HEALTH=$(curl -s http://localhost:8000/health || echo "down")
            FRONTEND_HTTP=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:80 || echo "000")
            echo "Tick $i: Backend='$BACKEND_HEALTH', Frontend HTTP='$FRONTEND_HTTP'"

            if [[ "$BACKEND_HEALTH" == *"healthy"* ]] && [[ "$FRONTEND_HTTP" == "200" ]]; then
              echo "Full stack successfully healthy and responding!"
              exit 0
            fi
            sleep 3
          done
          echo "Stack failed to become healthy within timeout window."
          docker compose ps -a
          docker compose logs
          exit 1

      - name: Teardown Stack
        if: always()
        run: docker compose down -v

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - PYTHONPATH=/app
      - DB_PATH=/app/data/simulation.db
      # Auth/CORS are dev-friendly by default (see backend/src/main.py):
      # CORS_ORIGINS defaults to the Vite dev server, API_KEY defaults to
      # empty (auth disabled). Override via .env/shell export if needed.
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      - API_KEY=${API_KEY:-}
    volumes:
      - ./backend/src:/app/src
      - ./shared:/app/shared
      - traffic_data_dev:/app/data
    command: ["uvicorn", "src.main:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  frontend:
    image: node:20.20.2-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    depends_on:
      - backend

volumes:
  traffic_data_dev:
